services:
  - type: web
    name: zonx-1
    rootDir: .
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/limon-bazaar.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: FRONTEND_URL
        value: https://oak79095-a11y.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Bayader Administrator
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: bayader-data
      mountPath: /data
      sizeGB: 10
