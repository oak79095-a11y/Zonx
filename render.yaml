services:
  - type: web
    name: zonx-1
    rootDir: .
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/limon-bazaar.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: LISTING_EXPIRATION_DAYS
        value: "0"
      - key: STORY_RETENTION_DAYS
        value: "0"
      - key: SESSION_TTL_DAYS
        value: "365"
      - key: CLASSIFIEDS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: FRONTEND_URL
        value: https://oak79095-a11y.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Bayader Administrator
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: bayader-data
      mountPath: /data
      sizeGB: 10
